version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    image: agentic-trader-backend:latest
    container_name: agentic-trader-backend
    restart: always
    # Production command: No reload, multiple workers
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redpanda:
        condition: service_started
    networks:
      - trader_net
    # No code volume mounts in production
    volumes:
      - app_data:/app/data

  postgres:
    image: postgres:15-alpine
    container_name: trader-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_secure}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    ports:
      - "127.0.0.1:5432:5432" # Bind to localhost only for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trader -d trading_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trader_net

  redis:
    image: redis:7.2-alpine
    container_name: trader-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379" # Bind to localhost only
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trader_net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: trader-clickhouse
    restart: always
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - trader_net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: trader-redpanda
    restart: always
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "127.0.0.1:18081:18081"
      - "127.0.0.1:18082:18082"
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - trader_net

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: trader-prometheus
    restart: always
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - trader_net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: trader-grafana
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - trader_net

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  redpanda_data:
  prometheus_data:
  grafana_data:
  app_data:


networks:
  trader_net:
    driver: bridge
