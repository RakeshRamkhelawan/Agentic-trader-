# =============================================================================
# PRODUCTION DOCKER COMPOSE
# Optimized for production deployment
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Infrastructure (Production Optimized)
  # ---------------------------------------------------------------------------
  
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-trader}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-trading_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - prod-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis:
    image: redis:7.2-alpine
    container_name: redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - prod-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse-prod
    restart: always
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-trader}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-trading_db}
    volumes:
      - clickhouse_prod_data:/var/lib/clickhouse
    networks:
      - prod-network

  # ---------------------------------------------------------------------------
  # Backend (Production)
  # ---------------------------------------------------------------------------
  
  api-server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      target: production
    container_name: api-server-prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-trader}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-trading_db}
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-trader}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - ALLOWED_ORIGINS=["https://yourdomain.com"]
      - CORS_ORIGINS=["https://yourdomain.com"]
      - WORKERS=4
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    networks:
      - prod-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Frontend (Production with Nginx)
  # ---------------------------------------------------------------------------
  
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend.prod
    container_name: frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - prod-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-prod
    restart: always
    volumes:
      - ./infrastructure/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - prometheus_prod_data:/prometheus
    networks:
      - prod-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_prod_data:/var/lib/grafana
    networks:
      - prod-network
    ports:
      - "3000:3000"

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_prod_data:
  redis_prod_data:
  clickhouse_prod_data:
  prometheus_prod_data:
  grafana_prod_data:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  prod-network:
    driver: bridge
