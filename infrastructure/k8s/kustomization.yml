apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentic-trader

resources:
  - namespace.yml
  - postgres.yml
  - redis.yml
  - api.yml
  - monitoring.yml
  - network-policy.yml

commonLabels:
  app.kubernetes.io/part-of: agentic-trader
  app.kubernetes.io/managed-by: kustomize

images:
  - name: agentic-trader-api
    newTag: latest

configMapGenerator:
  - name: api-config
    literals:
      - LOG_LEVEL=INFO
      - UVICORN_WORKERS=2
      - METRICS_PORT=9090
