apiVersion: v2
name: agentic-platform
description: Umbrella Helm chart for the Agentic Trader Platform
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: clickhouse
    version: "4.x.x"
    repository: "https://docs.altinity.com/clickhouse-for-kubernetes"
    condition: clickhouse.enabled
