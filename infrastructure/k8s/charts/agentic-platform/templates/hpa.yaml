{{- if .Values.agentOrchestrator.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentic-platform.fullname" . }}-orchestrator
  labels:
    {{- include "agentic-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "agentic-platform.fullname" . }}-orchestrator
  minReplicas: {{ .Values.agentOrchestrator.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agentOrchestrator.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.agentOrchestrator.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.agentOrchestrator.autoscaling.targetMemoryUtilizationPercentage }}
  {{- if .Values.agentOrchestrator.autoscaling.behavior }}
  behavior:
    {{- toYaml .Values.agentOrchestrator.autoscaling.behavior | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.dashboardApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentic-platform.fullname" . }}-dashboard
  labels:
    {{- include "agentic-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentic-platform.fullname" . }}-dashboard
  minReplicas: {{ .Values.dashboardApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.dashboardApi.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.dashboardApi.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.dashboardApi.autoscaling.targetMemoryUtilizationPercentage }}
  {{- if .Values.dashboardApi.autoscaling.behavior }}
  behavior:
    {{- toYaml .Values.dashboardApi.autoscaling.behavior | nindent 4 }}
  {{- end }}
{{- end }}
