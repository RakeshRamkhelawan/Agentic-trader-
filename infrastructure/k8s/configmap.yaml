apiVersion: v1
kind: ConfigMap
metadata:
  name: samkhya-config
  namespace: samkhya-trader
data:
  redis-url: "redis://samkhya-redis:6379/0"
  clickhouse-host: "samkhya-clickhouse"
  clickhouse-port: "9000"
  kafka-servers: "samkhya-kafka:9092"
  prometheus-url: "http://samkhya-prometheus:9090"
  cache-l1-ttl: "300"
  cache-l2-ttl: "900"
  cache-l3-ttl: "86400"
  ooda-cycle-interval: "60"
  max-position-size: "0.05"
  circuit-breaker-threshold: "5"
  circuit-breaker-timeout: "60"
