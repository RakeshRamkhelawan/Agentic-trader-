apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: agentic-trader
type: Opaque
stringData:
  bitvavo-api-key: ""
  bitvavo-api-secret: ""
  revolut-api-key: ""
  revolut-private-key: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentic-trader
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: agentic-trader-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://trader:trading_secure@postgres:5432/trading_db"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: CLICKHOUSE_HOST
              value: "clickhouse"
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CHROMA_DB_HOST
              value: "chromadb"
            - name: CHROMA_DB_PORT
              value: "8000"
            - name: KAFKA_BROKERS
              value: "redpanda:9092"
            - name: LOG_LEVEL
              value: "INFO"
            - name: UVICORN_WORKERS
              value: "2"
            - name: METRICS_PORT
              value: "9090"
            - name: BITVAVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: bitvavo-api-key
                  optional: true
            - name: BITVAVO_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: bitvavo-api-secret
                  optional: true
            - name: REVOLUT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: revolut-api-key
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agentic-trader
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: agentic-trader
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.agentic-trader.local
      secretName: api-tls
  rules:
    - host: api.agentic-trader.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
