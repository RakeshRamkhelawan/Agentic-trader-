apiVersion: apps/v1
kind: Deployment
metadata:
  name: samkhya-backend
  namespace: samkhya-trader
  labels:
    app: samkhya-backend
    component: core
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: samkhya-backend
  template:
    metadata:
      labels:
        app: samkhya-backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: samkhya-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: backend
        image: samkhya/backend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: samkhya-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: samkhya-config
              key: redis-url
        - name: CLICKHOUSE_HOST
          valueFrom:
            configMapKeyRef:
              name: samkhya-config
              key: clickhouse-host
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: samkhya-config
              key: kafka-servers
        - name: SWISSEPH_PATH
          value: "/app/ephe_data"
        - name: LOG_LEVEL
          value: "INFO"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: ephe-data
          mountPath: /app/ephe_data
          readOnly: true
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: ephe-data
        persistentVolumeClaim:
          claimName: ephe-data-pvc
      - name: config
        configMap:
          name: samkhya-config
---
apiVersion: v1
kind: Service
metadata:
  name: samkhya-backend
  namespace: samkhya-trader
  labels:
    app: samkhya-backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: samkhya-backend
  sessionAffinity: ClientIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: samkhya-backend
  namespace: samkhya-trader