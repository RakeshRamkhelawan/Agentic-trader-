apiVersion: v1
kind: Secret
metadata:
  name: samkhya-secrets
  namespace: samkhya-trader
type: Opaque
stringData:
  database-url: "postgresql://samkhya:CHANGE_ME@postgres:5432/samkhya_db"
  exchange-api-key: "CHANGE_ME"
  exchange-api-secret: "CHANGE_ME"
  auth0-domain: "CHANGE_ME.auth0.com"
  auth0-client-id: "CHANGE_ME"
  auth0-client-secret: "CHANGE_ME"
  vault-token: "CHANGE_ME"
  jwt-secret: "CHANGE_ME_RANDOM_256BIT_KEY"
