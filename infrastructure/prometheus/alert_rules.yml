groups:
  - name: samkhya_trading_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(samkhya_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} per second"

      - alert: CircuitBreakerOpen
        expr: samkhya_circuit_breaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is open"
          description: "Service {{ $labels.service }} circuit breaker has been open for over 1 minute"

      - alert: HighCacheM issRate
        expr: rate(samkhya_cache_misses_total[5m]) / rate(samkhya_cache_requests_total[5m]) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache miss rate above 50%"
          description: "Cache level {{ $labels.level }} miss rate is {{ $value | humanizePercentage }}"

      - alert: OODALoopStalled
        expr: time() - samkhya_ooda_last_cycle_timestamp > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OODA loop has stalled"
          description: "No OODA cycle completed in last 5 minutes"

      - alert: RahuKalaViolation
        expr: samkhya_rahu_kala_violations_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Trade attempted during Rahu Kala"
          description: "{{ $value }} Rahu Kala violations detected"

      - alert: PositionLimitExceeded
        expr: samkhya_position_size_ratio > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Position size exceeds 5% limit"
          description: "Position size is {{ $value | humanizePercentage }} of portfolio"

      - alert: HighLatencyOODA
        expr: histogram_quantile(0.95, rate(samkhya_ooda_cycle_duration_seconds_bucket[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High OODA loop latency"
          description: "95th percentile latency is {{ $value }}s"

      - alert: EphemerisCalculationFailure
        expr: rate(samkhya_ephemeris_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Swiss Ephemeris calculation failures"
          description: "{{ $value }} ephemeris errors per second"
