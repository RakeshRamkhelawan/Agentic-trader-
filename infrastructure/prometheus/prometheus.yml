global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'samkhya-trader'
    environment: 'production'

scrape_configs:
  - job_name: 'samkhya-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          component: 'core'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'samkhya_.*'
        action: keep

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          component: 'cache'

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
        labels:
          service: 'clickhouse'
          component: 'storage'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'infrastructure'

rule_files:
  - '/etc/prometheus/rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']