# Default values for agentic-trader.
# This is a YAML-formatted file.

# Global settings
global:
  environment: production
  region: us-east-1
  domain: agentic-trader.local

# API Server configuration
api:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/agentic-trader/platform
    pullPolicy: IfNotPresent
    tag: "latest"

  imagePullSecrets: []

  service:
    type: ClusterIP
    port: 8000
    metricsPort: 9090

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"
    hosts:
      - host: api.agentic-trader.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-tls
        hosts:
          - api.agentic-trader.local

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5

  env:
    - name: LOG_LEVEL
      value: "INFO"
    - name: UVICORN_WORKERS
      value: "2"
    - name: METRICS_PORT
      value: "9090"

  secrets:
    bitvavoApiKey: ""
    bitvavoApiSecret: ""
    revolutApiKey: ""
    revolutPrivateKey: ""

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/agentic-trader/platform-frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: app.agentic-trader.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: frontend-tls
        hosts:
          - app.agentic-trader.local

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# PostgreSQL configuration (subchart)
postgresql:
  enabled: true
  auth:
    username: trader
    password: trading_secure
    database: trading_db
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        memory: 1Gi
        cpu: 1000m
      requests:
        memory: 256Mi
        cpu: 250m

# Redis configuration (subchart)
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 128Mi
        cpu: 100m

# Grafana configuration (subchart)
grafana:
  enabled: true
  admin:
    user: admin
    password: admin
  persistence:
    enabled: true
    size: 10Gi
  dashboards:
    default:
      trading-overview:
        url: https://raw.githubusercontent.com/agentic-trader/platform/main/infrastructure/grafana/dashboards/trading-overview.json
      positions-pnl:
        url: https://raw.githubusercontent.com/agentic-trader/platform/main/infrastructure/grafana/dashboards/positions-pnl.json
      arbitrage-prices:
        url: https://raw.githubusercontent.com/agentic-trader/platform/main/infrastructure/grafana/dashboards/arbitrage-prices.json

# Prometheus configuration (subchart)
prometheus:
  enabled: true
  server:
    persistentVolume:
      enabled: true
      size: 20Gi
    retention: "15d"
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m
  alertmanager:
    enabled: true
    config:
      global:
        smtp_smarthost: 'localhost:587'
        smtp_from: 'alerts@agentic-trader.com'
      route:
        receiver: 'default'
        routes:
          - match:
              severity: critical
            receiver: 'pagerduty'
          - match:
              severity: warning
            receiver: 'slack'
      receivers:
        - name: 'default'
        - name: 'pagerduty'
          pagerduty_configs:
            - service_key: '<YOUR_PAGERDUTY_KEY>'
        - name: 'slack'
          slack_configs:
            - api_url: '<YOUR_SLACK_WEBHOOK>'
              channel: '#trading-alerts'

# Service mesh configuration
istio:
  enabled: false
  gateway:
    enabled: false
  sidecar:
    enabled: false

# Network policies
networkPolicy:
  enabled: true
  ingress:
    enabled: true
  egress:
    enabled: true

# Pod security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - agentic-trader
          topologyKey: kubernetes.io/hostname
