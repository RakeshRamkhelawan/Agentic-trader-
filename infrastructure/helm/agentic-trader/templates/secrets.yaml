apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-trader.fullname" . }}-api-secrets
  labels:
    {{- include "agentic-trader.labels" . | nindent 4 }}
type: Opaque
stringData:
  BITVAVO_API_KEY: {{ .Values.api.secrets.bitvavoApiKey | quote }}
  BITVAVO_API_SECRET: {{ .Values.api.secrets.bitvavoApiSecret | quote }}
  REVOLUT_API_KEY: {{ .Values.api.secrets.revolutApiKey | quote }}
  REVOLUT_PRIVATE_KEY: {{ .Values.api.secrets.revolutPrivateKey | quote }}
