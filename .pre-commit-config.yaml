# Pre-commit hooks for Agentic Trader Platform
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Usage:
#   pre-commit run --all-files    # Run manually
#   git commit                    # Runs automatically on commit

# Default settings
default_stages: [pre-commit]
default_language_version:
  python: python3.13

# Fail fast - stop on first error (set to false to see all issues)
fail_fast: false

repos:
  # ============================================================================
  # Basic File Checks (Blocking)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Prevent committing to main/develop directly
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
        stages: [commit-msg]

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check for broken symlinks
      - id: check-symlinks

      # Check JSON syntax
      - id: check-json
        files: \.(json)$
        exclude: tsconfig

      # Check YAML syntax
      - id: check-yaml
        files: \.(yml|yaml)$
        exclude: ^(.github/workflows/archive/|docker-compose\.)

      # Check TOML syntax
      - id: check-toml

      # Prevent large files
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Trim trailing whitespace
      - id: trailing-whitespace
        exclude: ^(frontend/|\.md$)

      # Ensure files end with newline
      - id: end-of-file-fixer
        exclude: ^(frontend/|\.min\.|\.lock$)

      # Check for private keys
      - id: detect-private-key

  # ============================================================================
  # Python - Code Quality (Blocking)
  # ============================================================================
  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black
        name: Python Formatting (Black)
        files: ^backend/.*\.py$
        exclude: ^backend/tests/
        args: [--line-length=100]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: Python Linting (Ruff)
        files: ^backend/.*\.py$
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Python Type Checking
        files: ^backend/.*\.py$
        exclude: ^backend/tests/
        args: [--ignore-missing-imports]
        additional_dependencies:
          - pydantic
          - sqlalchemy
          - types-redis

  # ============================================================================
  # Import Sorting (Blocking)
  # ============================================================================
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Python Import Sorting
        files: ^backend/.*\.py$
        exclude: ^backend/tests/
        args: [--profile=black, --line-length=100]

  # ============================================================================
  # Security Scans (Non-blocking - informational only)
  # ============================================================================
  - repo: local
    hooks:
      - id: bandit-security
        name: Bandit Security Scan (Info)
        entry: bash -c 'bandit -r backend/ --exclude backend/tests -f json -o bandit-report.json || echo "Bandit issues found - review report"'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
        verbose: true

# Skip hooks in CI environment
ci:
  skip: [no-commit-to-branch]
