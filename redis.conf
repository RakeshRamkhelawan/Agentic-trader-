# Redis Configuration for Agentic Trader Platform
# 
# This is a production-ready Redis configuration optimized for caching.
# Place this file in the project root and mount it in docker-compose.

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Append-only file (better durability for caching)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Client timeout
timeout 300
tcp-keepalive 60

# Disable dangerous commands in production (optional)
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG "CONFIG_6f4a8b2e9c1d"

# Performance tuning
databases 16
hz 10
dynamic-hz yes
