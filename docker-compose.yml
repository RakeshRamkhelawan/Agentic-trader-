version: '3.8'

# =============================================================================
# AGENTIC TRADER PLATFORM - FULL STACK DOCKER COMPOSE
# Includes: Infrastructure + Backend + Frontend
# =============================================================================

services:
  # ============================================================================
  # INFRASTRUCTURE LAYER
  # ============================================================================

  # 1. Message Broker (Redpanda - Kafka Compatible)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: redpanda
    restart: on-failure
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:28082
      - --advertise-pandaproxy-addr localhost:28082
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "9094:9092"
      - "28082:28082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - agentic-trader-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # Web UI for Redpanda
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.6
    container_name: redpanda-console
    restart: on-failure
    environment:
      - KAFKA_BROKERS=redpanda:29092
      - KAFKA_SASL_ENABLED=false
    ports:
      - "8081:8080"
    networks:
      - agentic-trader-network
    depends_on:
      - redpanda

  # 2. TimeSeries Database (ClickHouse)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      - "8124:8123" # HTTP
      - "9001:9000" # Native
    environment:
      - CLICKHOUSE_USER=trader
      - CLICKHOUSE_PASSWORD=trading_secure
      - CLICKHOUSE_DB=trading_db
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/storage/migrations:/docker-entrypoint-initdb.d
    networks:
      - agentic-trader-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # 3. Relational Database (PostgreSQL with TimescaleDB)
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: postgres
    restart: on-failure
    ports:
      - "5456:5432"
    environment:
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=trading_secure
      - POSTGRES_DB=trading_db
      - POSTGRES_INITDB_ARGS=-c max_connections=200 -c shared_buffers=256MB
    volumes:
      - postgres_data_final:/var/lib/postgresql/data
      - ./backend/storage/migrations/postgres:/docker-entrypoint-initdb.d
    networks:
      - agentic-trader-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trader -d trading_db" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Cache & Event Bus (Redis)
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: on-failure
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - agentic-trader-network
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # 5. Vector Database (ChromaDB)
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: chromadb
    restart: on-failure
    ports:
      - "8005:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - agentic-trader-network
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # 6. Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - agentic-trader-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - api-server

  # 7. Grafana (Visualization)
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3100:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ${PWD}/backend/observability/grafana_provisioning_datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml
    networks:
      - agentic-trader-network
    depends_on:
      - prometheus

  # ============================================================================
  # BACKEND SERVICES
  # ============================================================================

  # Main API Server (FastAPI)
  api-server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: api-server
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      chromadb:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://trader:trading_secure@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=trader
      - CLICKHOUSE_PASSWORD=trading_secure
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://frontend:5173","http://localhost:5173"]
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://frontend:5173"]
      - METRICS_SERVER_PORT=8000
      - ENVIRONMENT=docker
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - /dev/shm:/dev/shm
    networks:
      - agentic-trader-network
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload --workers 1
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # Federated Triad Service
  federated-triad:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: federated-triad
    restart: on-failure:5
    depends_on:
      - api-server
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - API_SERVER_URL=http://api-server:8000
      - FEDERATED_MODE=enabled
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - /dev/shm:/dev/shm
    networks:
      - agentic-trader-network
    command: python -m scripts.trika_federated_system
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ============================================================================
  # FRONTEND SERVICE
  # ============================================================================

  # React Frontend (Vite + React 19)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: frontend
    restart: on-failure:5
    depends_on:
      - api-server
    environment:
      - VITE_API_URL=http://api-server:8000
      - VITE_WS_URL=ws://api-server:8000/ws
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"  # Vite default port
      - "3000:5173"  # Also expose on 3000 for compatibility
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - agentic-trader-network
    command: npm run dev -- --host 0.0.0.0 --port 5173
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5173" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend Production Build (Nginx)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend.prod
    container_name: frontend-prod
    restart: on-failure:5
    depends_on:
      - api-server
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=/ws
    ports:
      - "80:80"
      - "443:443"
    networks:
      - agentic-trader-network
    profiles:
      - production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  redpanda_data:
    driver: local
  clickhouse_data:
    driver: local
  postgres_data_final:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  prediction_market_cache:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  agentic-trader-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
