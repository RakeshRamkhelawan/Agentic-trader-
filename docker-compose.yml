version: '3.8'

services:
  # --- INFRASTRUCTURE LAYER ---

  # 1. Message Broker (Redpanda - Kafka Compatible)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: redpanda
    restart: on-failure
    command:
      - redpanda start
      - --smp 1 # Beperk CPU gebruik voor dev
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:28082
      - --advertise-pandaproxy-addr localhost:28082
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "9094:9092"
      - "28082:28082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # Web UI for Redpanda (Optional but super useful)
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.6
    container_name: redpanda-console
    restart: on-failure
    environment:
      - KAFKA_BROKERS=redpanda:29092
      - KAFKA_SASL_ENABLED=false
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

  # 2. TimeSeries Database (ClickHouse)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      - "8124:8123" # HTTP (Changed to 8124 for isolation)
      - "9001:9000" # Native (Changed to 9001 for isolation)
    environment:
      - CLICKHOUSE_USER=trader
      - CLICKHOUSE_PASSWORD=trading_secure
      - CLICKHOUSE_DB=trading_db
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/storage/migrations:/docker-entrypoint-initdb.d # Mount directly to initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # 3. Relational Database (PostgreSQL)
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: postgres
    restart: on-failure
    ports:
      - "5456:5432"
    environment:
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=trading_secure
      - POSTGRES_DB=trading_db
      - POSTGRES_INITDB_ARGS=-c max_connections=200 -c shared_buffers=256MB
    volumes:
      - postgres_data_final:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trader -d trading_db" ]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: on-failure
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 3

  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: chromadb
    restart: on-failure
    ports:
      - "8005:8000" # Mapped to 8005 to avoid 8000 conflict
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # 5. Prometheus (Metrics Monitoring)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:

      - api-server # Nu afhankelijk van de api-server

  # 6. Grafana (Visualization)
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3100:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ${PWD}/backend/observability/grafana_provisioning_datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml
    depends_on:
      - prometheus

  # --- APPLICATION LAYER ---

  # Multi-Frequency Consciousness Architecture
  consciousness-architecture:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: consciousness-architecture
    restart: on-failure:5
    depends_on:
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - METRICS_SERVER_PORT=8000
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8006:8000"
    volumes:
      - ./backend:/app/backend
      - /dev/shm:/dev/shm # Shared memory for zero-copy IPC
    command: python backend/consciousness_main.py
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # The Cognitive Orchestrator & Agents
  trading-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: trading-engine
    restart: on-failure:5
    depends_on:
      redpanda:
        condition: service_started
      clickhouse:
        condition: service_started
      redis:
        condition: service_started
      chromadb:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=trader
      - CLICKHOUSE_PASSWORD=trading_secure
      - PYTHONUNBUFFERED=1
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://trader:trading_secure@postgres:5432/trading_db
      - REVOLUT_PRIVATE_KEY_PATH=/app/revolut_private.pem
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend # Hot reload for development
      - ./.env:/app/.env:ro
      - ./revolut_private.pem:/app/revolut_private.pem:ro
      - ./backend/config/agent_profiles.yaml:/app/backend/config/agent_profiles.yaml:ro
    entrypoint: [ "/bin/bash", "/app/backend/scripts/start.sh" ]
    command: python backend/services/cognitive_orchestrator.py
    ports:
      - "8004:8004"
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # API Server (Main Entrypoint)
  api-server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: api-server
    restart: on-failure:5
    depends_on:
      trading-engine:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - METRICS_SERVER_PORT=8001
      - DATABASE_URL=postgresql+asyncpg://trader:trading_secure@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=trader
      - CLICKHOUSE_PASSWORD=trading_secure
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]
      - REVOLUT_PRIVATE_KEY_PATH=/app/revolut_private.pem
    ports:
      - "8003:8001"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env:ro
      - ./revolut_private.pem:/app/revolut_private.pem:ro
    user: "root"
    entrypoint: ["/bin/sh", "-c"]
    command: ["pip install python-multipart && uvicorn backend.api.main:app --host 0.0.0.0 --port 8001 --workers 2"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # Prediction Market Intelligence Service
  # Analyzes Kalshi & Polymarket data for market intelligence signals
  prediction-intelligence:
    build:
      context: ./prediction-market-analysis
      dockerfile: Dockerfile
    container_name: prediction_intelligence
    restart: on-failure:5
    ports:
      - "8002:8002"
    volumes:
      # Persistent data storage (parquet files)
      - ./prediction-market-analysis/data:/app/data
      # Cache for DuckDB queries
      - prediction_market_cache:/app/.cache
      # Output directory for analyses
      - ./prediction-market-analysis/output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=prediction-intelligence
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Database connections (shared with main platform)
      - DATABASE_URL=postgresql+asyncpg://trader:trading_secure@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/2
      # External API keys (optional)
      - KALSHI_API_KEY=${KALSHI_API_KEY:-}
      - POLYGON_RPC=${POLYGON_RPC:-https://polygon-rpc.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2.5G
        reservations:
          cpus: '1'
          memory: 1.5G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Frontend (Vite React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: on-failure:5
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8003
      - VITE_WS_URL=ws://localhost:8003
      - VITE_AUTH0_DOMAIN=agentictrader.eu.auth0.com
      - VITE_AUTH0_CLIENT_ID=aO41wQ7VRzDoHavsdxamJpuSCa47wUJ8
      - VITE_AUTH0_AUDIENCE=https://api.agentic-trader.com
    depends_on:
      api-server:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data_final:
  redpanda_data:
  clickhouse_data:
  redis_data:
  chromadb_data:
  prometheus_data:
  grafana_data:
  prediction_market_cache:
