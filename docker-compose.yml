# Agentic Trader Platform - Docker Compose Production Stack
#
# Usage:
#   docker-compose up --build -d          # Start all services
#   docker-compose logs -f api            # View API logs
#   docker-compose down                   # Stop all services
#   docker-compose down -v                # Stop and remove volumes

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: trader-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=trading_secure
      - POSTGRES_DB=trading_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_db"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - trader-network

  # ClickHouse Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: trader-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=trading_analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - trader-network

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: trader-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - trader-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: trader-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Core settings
      - DATABASE_URL=postgresql+asyncpg://trader:trading_secure@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - LOG_LEVEL=INFO

      # Security (set these in production!)
      # - SECRET_KEY=your-secret-key-here
      # - JWT_SECRET_KEY=your-jwt-secret-here

      # Performance
      - UVICORN_WORKERS=4
      - MAX_WORKERS=4

      # Cache settings
      - CACHE_TTL_VEDASTRO=3600
      - CACHE_TTL_MARKET_DATA=300

      # Feature flags
      - ENABLE_CACHE=true
      - ENABLE_PARALLEL=true
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - trader-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx Reverse Proxy (for SSL/load balancing)
  # Uncomment in production with SSL certificates
  # nginx:
  #   image: nginx:alpine
  #   container_name: trader-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - trader-network

# Named volumes for persistence
volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  redis_data:
    driver: local

# Custom network for service communication
networks:
  trader-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
