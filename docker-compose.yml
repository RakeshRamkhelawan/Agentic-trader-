version: '3.8'

services:
  api:
    build: .
    container_name: agentic_trader_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/trader
      - REDIS_URL=redis://redis:6379/0
      - BITVAVO_API_KEY=${BITVAVO_API_KEY:-placeholder}
      - BITVAVO_API_SECRET=${BITVAVO_API_SECRET:-placeholder}
      - REVOLUT_API_KEY=${REVOLUT_API_KEY:-placeholder}
      - AUTH_DISABLED=true
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:15-alpine
    container_name: agentic_trader_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=trader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agentic_trader_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
