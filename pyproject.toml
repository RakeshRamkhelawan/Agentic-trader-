[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trader-platform"
version = "1.0.0"
description = "AI-powered algorithmic trading platform with Vedic astrology integration"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["trading", "ai", "vedic-astrology", "algorithmic-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/yourusername/agentic-trader"
Repository = "https://github.com/yourusername/agentic-trader"
Documentation = "https://docs.agentic-trader.com"

# ============================================================================
# Black Configuration
# ============================================================================
[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
  | node_modules
  | venv
  | \.venv
  | frontend
  | docs
  # specific files
  | .*\.min\.py
  | .*\.pyc
)/
'''

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
target-version = "py313"
line-length = 100

# Include all files by default
include = ["*.py", "*.pyi", "**/pyproject.toml"]

# Exclude common non-Python directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "frontend",
    "docs",
    "*.min.py",
]

[tool.ruff.lint]
# Enable all rules by default, then disable problematic ones
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Disable rules that are too strict for our codebase
ignore = [
    "E501",  # Line too long (handled by black)
    "E402",  # Module level import not at top (common in FastAPI)
    "E203",  # Whitespace before ':' (handled by black)
    "N802",  # Function name should be lowercase (we use some camelCase)
    "N803",  # Argument name should be lowercase
    "N806",  # Variable in function should be lowercase
    "N815",  # Variable in class scope should not be mixedCase
    "SIM105", # Use contextlib.suppress (too opinionated)
    "SIM108", # Use ternary operator (sometimes less readable)
    "B008",   # FastAPI: Depends() in function signatures is required by the framework
    "B904",   # raise-from-e: overly strict for HTTP exception re-raising in FastAPI handlers
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15  # Relaxed for trading algorithms

# ============================================================================
# Bandit Configuration
# ============================================================================
[tool.bandit]
exclude_dirs = ["backend/tests", "venv", ".venv", "node_modules"]
skips = [
    "B101",  # assert_used (common in tests)
    "B105",  # hardcoded_password_string (we use env vars)
    "B311",  # random (we use random for mock data)
]

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

# ============================================================================
# MyPy Configuration (relaxed for now)
# ============================================================================
[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true
exclude = [
    "venv",
    ".venv",
    "node_modules",
    "frontend",
    "backend/tests",
]

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/node_modules/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
