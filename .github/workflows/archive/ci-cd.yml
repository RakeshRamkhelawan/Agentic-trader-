name: CI/CD Pipeline - Production Grade

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/agentic-trader

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'

      - name: Install Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff mypy bandit
          if [ -f requirements/dev-lock.txt ]; then
            pip install -r requirements/dev-lock.txt
          elif [ -f requirements/dev.txt ]; then
            pip install -r requirements/dev.txt
          fi

      - name: Run Black (Code Formatting)
        run: black --check --diff backend/
        continue-on-error: false

      - name: Run Isort (Import Sorting)
        run: isort --check-only --diff backend/
        continue-on-error: false

      - name: Run Ruff (Fast Linting)
        run: ruff check backend/ --output-format=github
        continue-on-error: false

      - name: Run MyPy (Type Checking)
        run: mypy backend/ --install-types --non-interactive --ignore-missing-imports
        continue-on-error: true

      - name: Security Scan with Bandit
        run: |
          bandit -r backend/ --exclude backend/tests -f json -o bandit-report.json || true
          ls -la bandit-report.json || echo "Bandit report not found"
        continue-on-error: true

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  unit-tests:
    name: Unit Tests
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/base.txt ]; then
            pip install -r requirements/base.txt
          fi
          if [ -f requirements/test.txt ]; then
            pip install -r requirements/test.txt
          fi
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Run Unit Tests with Coverage
        run: |
          python -m pytest backend/tests/unit/ \
            -v \
            --cov=backend \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junit-xml=junit-unit.xml \
            --maxfail=5
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET_KEY: test_secret_key_for_ci
          LLM_PROVIDER: mock

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            junit-unit.xml
            htmlcov/
          retention-days: 30

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unit
          name: unit-tests
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    needs: code-quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trading_secure
          POSTGRES_DB: trading_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/base.txt ]; then
            pip install -r requirements/base.txt
          fi
          if [ -f requirements/test.txt ]; then
            pip install -r requirements/test.txt
          fi
          pip install pytest pytest-asyncio pytest-timeout

      - name: Wait for Services
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:8123/ping > /dev/null; do sleep 1; done'
          echo "ClickHouse ready"
          timeout 30s bash -c 'until pg_isready -h localhost -p 5432 -U trader; do sleep 1; done'
          echo "PostgreSQL ready"

      - name: Run Integration Tests
        run: |
          python -m pytest backend/tests/integration/ \
            -v \
            --junit-xml=junit-integration.xml \
            --timeout=300 \
            --maxfail=3
        env:
          DATABASE_URL: postgresql+asyncpg://trader:trading_secure@localhost:5432/trading_db
          REDIS_URL: redis://localhost:6379/0
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          JWT_SECRET_KEY: test_secret_key_for_ci
          LLM_PROVIDER: mock
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: junit-integration.xml
          retention-days: 30

  docker-build:
    name: Docker Build & Push
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Build Frontend Image
        if: hashFiles('frontend/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-tests:
    name: End-to-End Tests
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Start Services
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 30

      - name: Wait for Health Checks
        run: |
          timeout 120s bash -c 'until curl -f http://localhost:8001/health; do sleep 5; done'

      - name: Run E2E Tests
        run: |
          docker compose exec -T backend python -m pytest backend/tests/e2e/ -v --junit-xml=junit-e2e.xml || true

      - name: Collect Logs
        if: always()
        run: |
          mkdir -p logs
          docker compose logs > logs/docker-compose.log

      - name: Stop Services
        if: always()
        run: docker compose down -v

      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            junit-e2e.xml
            logs/
          retention-days: 30

  security-scan:
    name: Security Vulnerability Scan
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    needs: [e2e-tests, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.agentic-trader.example.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging (Placeholder)
        run: |
          echo "Deploying to staging environment..."
          echo "Image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  deploy-production:
    name: Deploy to Production
    needs: [e2e-tests, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://agentic-trader.example.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production (Placeholder)
        run: |
          echo "Deploying to production environment..."
          echo "Image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Manual approval required in GitHub UI"
