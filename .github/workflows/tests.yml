name: Tests & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements/base-lock.txt', 'requirements/test-lock.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install base dependencies (prod-like)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base.txt

    - name: Install test dependencies
      run: |
        pip install -r requirements/test.txt
    
    - name: Run unit tests
      run: |
        python -m pytest backend/tests/unit/ -v --cov=backend --cov-report=xml --tb=short
    
    - name: Run integration tests (requires docker services to be up)
      # Temporarily skip integration tests requiring external services for initial CI pass
      # until we have full docker-compose setup in CI.
      run: |
        echo "Skipping full integration tests for now, focus on unit tests."
        # python -m pytest backend/tests/integration/ -v --cov=backend --cov-report=xml --tb=short
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install security tools and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev-lock.txt # semgrep, mcp zijn hierin
        pip install bandit safety
    
    - name: Run GitGuardian Security Checks
      uses: GitGuardian/ggshield-action@v2
      env:
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

    - name: Run Bandit (code security check)
      run: bandit -r backend/ -f json -o bandit-report.json || true
      continue-on-error: true
    
    - name: Run Safety (dependency check)
      run: safety check --json -r requirements/base-lock.txt || true # Check prod dependencies
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install linting tools and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev-lock.txt # mypy, black, isort, ruff zijn hierin
    
    - name: Run MyPy type checking
      run: mypy backend/ --strict || true
      continue-on-error: true
    
    - name: Check code formatting
      run: black --check backend/ || true
      continue-on-error: true
    
    - name: Check imports order (isort)
      run: isort --check-only backend/ || true
      continue-on-error: true
    
    - name: Run Ruff linter
      run: ruff check backend/ || true
      continue-on-error: true