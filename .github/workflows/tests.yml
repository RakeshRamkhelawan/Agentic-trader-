name: Tests & Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev-lock.txt
          
      - name: Run Black (Formatting)
        run: black --check backend/
        
      - name: Run Isort (Imports)
        run: isort --check-only backend/
        
      - name: Run Ruff (Linting)
        run: ruff check backend/

      - name: Run MyPy (Type Checking)
        run: mypy backend/ --strict

  backend-tests:
    name: Backend Tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trading_secure
          POSTGRES_DB: trading_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/test.txt
          
      - name: Wait for ClickHouse
        run: |
          # Simple wait loop for ClickHouse http port
          timeout 60s bash -c 'until curl -s http://localhost:8123/ping > /dev/null; do sleep 1; done'

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://trader:trading_secure@localhost:5432/trading_db
          REDIS_URL: redis://localhost:6379/0
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          JWT_SECRET_KEY: test_secret_key
        run: |
          python -m pytest backend/tests/unit/ -v --cov=backend --cov-report=xml
          
      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql+asyncpg://trader:trading_secure@localhost:5432/trading_db
          REDIS_URL: redis://localhost:6379/0
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          JWT_SECRET_KEY: test_secret_key
          LLM_PROVIDER: mock
        run: |
          python -m pytest backend/tests/integration/ -v

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Check
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: false
          tags: agentic-trader:test