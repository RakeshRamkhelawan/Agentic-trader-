# =============================================================================
# DEPLOYMENT WORKFLOW - Docker Compose Deployment
# =============================================================================
# Triggers:
#   - workflow_dispatch (manual)
#   - After successful CI on main branch
# =============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy (git SHA or tag)'
        required: false
        default: 'latest'
  workflow_run:
    workflows: ["CI - Streamlined & Reliable"]
    branches: [main]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  # ============================================================================
  # DEPLOY TO STAGING
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.environment == 'staging' ||
      (github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main')
    environment:
      name: staging
      url: https://staging.agentic-trader.local

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to Staging Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'REMOTE_SCRIPT'
            set -e

            echo "🚀 Starting deployment to staging..."

            # Create app directory if not exists
            mkdir -p ~/agentic-trader
            cd ~/agentic-trader

            # Download latest docker-compose.prod.yml
            curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker/docker-compose.prod.yml

            # Create .env file from secrets
            cat > .env << 'ENV_EOF'
            TRADING_MODE=paper
            POSTGRES_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
            JWT_SECRET_KEY=${{ secrets.STAGING_JWT_SECRET }}
            BITVAVO_API_KEY=${{ secrets.STAGING_BITVAVO_KEY }}
            BITVAVO_API_SECRET=${{ secrets.STAGING_BITVAVO_SECRET }}
            VITE_API_URL=https://staging-api.agentic-trader.local
            VITE_WS_URL=wss://staging-api.agentic-trader.local/ws
            ENV_EOF

            # Pull latest images
            docker-compose pull

            # Run database migrations
            docker-compose run --rm api alembic upgrade head || echo "Migration skipped or failed"

            # Start services
            docker-compose up -d --remove-orphans

            # Health check
            sleep 10
            curl -f http://localhost:8000/api/v1/health || exit 1

            echo "✅ Staging deployment complete!"
          REMOTE_SCRIPT

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "URL: https://staging.agentic-trader.local"

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://agentic-trader.local

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Approval Checkpoint
        run: |
          echo "⚠️ PRODUCTION DEPLOYMENT"
          echo "Version: ${{ github.event.inputs.version }}"
          echo "This deployment requires manual approval in GitHub Environments"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Deploy to Production Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'REMOTE_SCRIPT'
            set -e

            echo "🚀 Starting deployment to PRODUCTION..."

            mkdir -p ~/agentic-trader
            cd ~/agentic-trader

            # Backup current state
            docker-compose exec -T api pg_dump $DATABASE_URL > backup_$(date +%Y%m%d_%H%M%S).sql || echo "Backup skipped"

            # Download latest compose file
            curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker/docker-compose.prod.yml

            # Create production .env
            cat > .env << 'ENV_EOF'
            TRADING_MODE=live
            POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            JWT_SECRET_KEY=${{ secrets.PROD_JWT_SECRET }}
            BITVAVO_API_KEY=${{ secrets.PROD_BITVAVO_KEY }}
            BITVAVO_API_SECRET=${{ secrets.PROD_BITVAVO_SECRET }}
            VITE_API_URL=https://api.agentic-trader.local
            VITE_WS_URL=wss://api.agentic-trader.local/ws
            ENV_EOF

            # Pull specific version
            export VERSION=${{ github.event.inputs.version }}
            docker-compose pull

            # Run migrations with backup
            docker-compose run --rm api alembic upgrade head

            # Rolling update
            docker-compose up -d --no-deps --scale api=2 api
            sleep 30
            docker-compose up -d --no-deps --scale api=1 api
            docker-compose up -d --remove-orphans

            # Health check
            sleep 10
            curl -f http://localhost:8000/api/v1/health || exit 1

            echo "✅ Production deployment complete!"
          REMOTE_SCRIPT

      - name: Notify on Success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Version: ${{ github.event.inputs.version }}"

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Consider rollback:"
          echo "docker-compose down && docker-compose up -d --scale api=0"
