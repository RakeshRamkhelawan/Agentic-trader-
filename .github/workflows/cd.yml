name: CD - Deploy to Kubernetes

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # DEPLOY TO STAGING
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.agentic-trader.local

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 'v5.3.0'

      - name: Configure Kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to Staging
        run: |
          export KUBECONFIG=kubeconfig
          cd infrastructure/k8s

          # Update image tags
          kustomize edit set image agentic-trader-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Apply manifests
          kustomize build . | kubectl apply -f -

          # Wait for rollout
          kubectl rollout status deployment/api -n agentic-trader --timeout=300s
          kubectl rollout status deployment/postgres -n agentic-trader --timeout=300s
          kubectl rollout status deployment/redis -n agentic-trader --timeout=300s

      - name: Verify Deployment
        run: |
          export KUBECONFIG=kubeconfig
          kubectl get pods -n agentic-trader
          kubectl get svc -n agentic-trader

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://agentic-trader.local

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 'v5.3.0'

      - name: Configure Kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Run Database Migrations
        run: |
          export KUBECONFIG=kubeconfig
          kubectl run migration-${{ github.run_id }} \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --rm -i --restart=Never \
            --namespace=agentic-trader \
            --command -- alembic upgrade head

      - name: Deploy to Production
        run: |
          export KUBECONFIG=kubeconfig
          cd infrastructure/k8s

          # Update image tags
          kustomize edit set image agentic-trader-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Apply manifests
          kustomize build . | kubectl apply -f -

          # Wait for rollout
          kubectl rollout status deployment/api -n agentic-trader --timeout=300s

      - name: Verify Deployment
        run: |
          export KUBECONFIG=kubeconfig
          kubectl get pods -n agentic-trader

          # Health check
          kubectl port-forward svc/api 8000:8000 -n agentic-trader &
          sleep 5
          curl -f http://localhost:8000/health || exit 1

      - name: Notify on Success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Version: ${{ github.sha }}"
          echo "URL: https://agentic-trader.local"

      - name: Rollback on Failure
        if: failure()
        run: |
          export KUBECONFIG=kubeconfig
          echo "❌ Deployment failed, rolling back..."
          kubectl rollout undo deployment/api -n agentic-trader
          kubectl rollout status deployment/api -n agentic-trader --timeout=300s
