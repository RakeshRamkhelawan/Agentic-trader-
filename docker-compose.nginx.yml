# Nginx + Frontend only - Backend runs locally
version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: agentic_trader_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - trader-network
    restart: always

networks:
  trader-network:
    external: true
    name: agentic_trader_platform_1734_20260109_210621_trader-network
