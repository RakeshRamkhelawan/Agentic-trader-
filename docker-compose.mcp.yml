# Docker Compose - MCP ToolBroker Service
# 
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.mcp.yml up -d
#
# This adds the MCP ToolBroker service for agent tool execution.

version: '3.8'

services:
  # ============================================================================
  # MCP ToolBroker - Tool execution service for agents
  # ============================================================================
  mcp-broker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mcp
    container_name: agentic_trader_mcp_broker
    ports:
      - "8001:8001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - MCP_LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://user:pass@db:5432/trader
      - REDIS_URL=redis://redis:6379/0
      - BITVAVO_API_KEY=${BITVAVO_API_KEY:-placeholder}
      - BITVAVO_API_SECRET=${BITVAVO_API_SECRET:-placeholder}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-placeholder}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-placeholder}
      - NEWS_API_KEY=${NEWS_API_KEY:-placeholder}
      - PYTHONUNBUFFERED=1
    command: python -m backend.mcp_broker.http_server
    volumes:
      - ./backend:/app/backend
      - ./logs/mcp:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - agentic_trader_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # API Server - With MCP client configuration
  # ============================================================================
  api:
    environment:
      - MCP_BROKER_URL=http://mcp-broker:8001
      - MCP_ENABLED=true
    depends_on:
      mcp-broker:
        condition: service_healthy

networks:
  agentic_trader_network:
    external: true
