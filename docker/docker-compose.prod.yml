# Production Docker Compose - Agentic Trader Platform
version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: agentic_trader_traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - agentic_trader_network

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agentic_trader_api
    environment:
      - API_PORT=8000
      - TRADING_MODE=${TRADING_MODE:-paper}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trading_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - agentic_trader_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: agentic_trader_frontend
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WS_URL=${VITE_WS_URL}
    depends_on:
      - api
    networks:
      - agentic_trader_network

  db:
    image: postgres:15-alpine
    container_name: agentic_trader_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-trader}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-trading_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agentic_trader_network

  redis:
    image: redis:7-alpine
    container_name: agentic_trader_redis
    volumes:
      - redis_data:/data
    networks:
      - agentic_trader_network

networks:
  agentic_trader_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  traefik_certs:
