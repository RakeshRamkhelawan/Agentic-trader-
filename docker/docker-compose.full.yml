# Docker Compose - Full Stack with Monitoring
#
# Usage:
#   docker-compose -f docker-compose.full.yml up -d
#
# Services included:
#   - API Server (FastAPI)
#   - Frontend (React/Vite)
#   - PostgreSQL (primary DB)
#   - ClickHouse (analytics)
#   - Redis (cache/events)
#   - ChromaDB (vector DB)
#   - Redpanda (Kafka-compatible message broker)
#   - Prometheus (metrics)
#   - Grafana (dashboards)
#   - Nginx (reverse proxy)

version: '3.8'

services:
  # ============================================================================
  # BACKEND API
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_trader_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://trader:trading_secure@postgres:5432/trading_db
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_NATIVE_PORT=9000
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000  # Intern in container
      - KAFKA_BROKERS=redpanda:9092  # Intern in container
      - BITVAVO_API_KEY=${BITVAVO_API_KEY:-}
      - BITVAVO_API_SECRET=${BITVAVO_API_SECRET:-}
      - REVOLUT_API_KEY=${REVOLUT_API_KEY:-}
      - REVOLUT_PRIVATE_KEY_PATH=/secrets/revolut_private.pem
      - LOG_LEVEL=INFO
      - UVICORN_WORKERS=2
      - METRICS_PORT=9090
    volumes:
      - ./revolut_private.pem:/secrets/revolut_private.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - trader-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # FRONTEND
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic_trader_frontend
    ports:
      - "3080:80"  # Frontend production op 3080
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - api
    networks:
      - trader-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # DATABASE - PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: agentic_trader_postgres
    environment:
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=trading_secure
      - POSTGRES_DB=trading_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/storage/migrations:/docker-entrypoint-initdb.d
    networks:
      - trader-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # ANALYTICS - ClickHouse
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: agentic_trader_clickhouse
    ports:
      - "5000:8123"  # HTTP interface
      - "5001:9000"  # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trader-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ============================================================================
  # CACHE - Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: agentic_trader_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - trader-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # VECTOR DB - ChromaDB
  # ============================================================================
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: agentic_trader_chromadb
    ports:
      - "8100:8000"  # ChromaDB op 8100
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - trader-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # MESSAGE BROKER - Redpanda
  # ============================================================================
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: agentic_trader_redpanda
    ports:
      - "6000:9092"  # Kafka API
      - "6001:9644"  # Admin API
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - trader-network
    restart: always
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================================
  # MONITORING - Prometheus
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: agentic_trader_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - trader-network
    restart: always
    depends_on:
      - api

  # ============================================================================
  # MONITORING - Grafana
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.2
    container_name: agentic_trader_grafana
    ports:
      - "9000:3000"  # Grafana op 9000 (niet 3000, dat is frontend)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:9000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infrastructure/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    networks:
      - trader-network
    restart: always
    depends_on:
      - prometheus

  # ============================================================================
  # REVERSE PROXY - Nginx
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: agentic_trader_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - trader-network
    restart: always

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  trader-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local
  redpanda_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
