[pytest]
# Pytest configuration for TDD workflow

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires Docker services)
    slow: Slow running tests
    
# Default test path
testpaths = backend/tests

# Show extra test summary info
addopts = 
    -v
    --tb=short
    --strict-markers
    
# Ignore paths
norecursedirs = .git .tox dist build *.egg __pycache__ node_modules

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::pydantic.warnings.PydanticDeprecatedSince212

# Coverage options (optional, for future use)
# --cov=backend
# --cov-report=html
# --cov-report=term-missing
