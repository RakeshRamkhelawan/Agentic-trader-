# ALEMBIC CONFIGURATION
# Database migration configuration for Agentic Trader Platform

[alembic]
# Path to migration scripts
script_location = backend/migrations

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# Version path separator
version_path_separator = os

# SQLAlchemy database URL (will be overwritten by env.py)
sqlalchemy.url = postgresql+asyncpg://trader:pIu4r4xm8wel5_vBkKYi_mjelL4Hp35E@localhost:5432/trading_db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
