services:
  api-server:
    build:
      target: production
    ports:
      - "8003:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]
    volumes:
      - ./backend:/app/backend:cached
      - ./scripts:/app/scripts:cached
      - ./data:/app/data:cached
    # Override entrypoint to run uvicorn directly
    entrypoint: ["uvicorn"]
    command: ["backend.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/backend"]
    healthcheck:
      # Using python instead of curl since curl may not be in the image
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8003
      - VITE_WS_URL=ws://localhost:8003/ws
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      # Vite dev server doesn't have a health endpoint, checking if port is open
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5456:5432"
    environment:
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=trading_secure
      - POSTGRES_DB=trading_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    ports:
      - "7380:6379"

  clickhouse:
    ports:
      - "9124:8123"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  chromadb:
    ports:
      - "9005:8000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redpanda:
    ports:
      - "10094:9092"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redpanda-console:
    ports:
      - "9081:8080"
    profiles:
      - monitoring

  prometheus:
    ports:
      - "10091:9090"
    profiles:
      - monitoring
      
  grafana:
    ports:
      - "4100:3000"
    profiles:
      - monitoring

  federated-triad:
    ports:
      - "10001:8001"

volumes:
  backend_venv:
  frontend_node_modules:
  postgres_dev_data:
