# Docker Compose Override for Local Development
# 
# This file automatically extends docker-compose.yml for local development.
# It adds useful features like:
# - Hot reload (volume mounting)
# - Debug logging
# - Exposed ports for debugging
# 
# Usage: docker-compose up -d (this file is automatically used)

version: '3.8'

services:
  api:
    # Override for development
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    
    # Mount source code for hot reload
    volumes:
      - ./backend:/app/backend:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./cache:/app/cache
    
    # Development environment
    environment:
      - LOG_LEVEL=DEBUG
      - UVICORN_RELOAD=true
      - PYTHONDONTWRITEBYTECODE=1
    
    # Expose debug port (for pdb)
    stdin_open: true
    tty: true

  redis:
    # Expose Redis port for local debugging
    ports:
      - "6379:6379"
    
    # Use memory-only mode for faster development (optional)
    # command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
